<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- background (keeps it readable in GitHub dark mode) -->
  <rect x="0" y="0" width="880" height="430" rx="12" fill="#ffffff"/>

  <!-- Proxmox host -->
  <rect x="20" y="20" width="840" height="240" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="46" font-size="15" font-weight="600" fill="#1f2328">Proxmox VE host</text>
  <text x="840" y="46" font-size="12" fill="#57606a" text-anchor="end">lab network 10.78.0.0/24 behind NAT</text>

  <!-- gateway -->
  <rect x="40" y="70" width="170" height="130" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="125" y="100" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">SDN VNet kublrh</text>
  <text x="125" y="124" font-size="12" fill="#57606a" text-anchor="middle">gateway 10.78.0.1</text>
  <text x="125" y="144" font-size="12" fill="#57606a" text-anchor="middle">NAT to the internet</text>
  <text x="125" y="174" font-size="12" fill="#57606a" text-anchor="middle">snapshot "clean"</text>
  <text x="125" y="190" font-size="12" fill="#57606a" text-anchor="middle">on every VM</text>

  <!-- bus -->
  <path d="M125,200 V232 H750" fill="none" stroke="#8c959f" stroke-width="2"/>
  <path d="M350,232 V200 M550,232 V200 M750,232 V200" fill="none" stroke="#8c959f" stroke-width="2"/>

  <!-- utility -->
  <rect x="260" y="70" width="180" height="130" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M268,70 H432 A8,8 0 0 1 440,78 V96 H260 V78 A8,8 0 0 1 268,70 z" fill="#57606a"/>
  <text x="350" y="88" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">utility</text>
  <text x="350" y="116" font-size="12" fill="#1f2328" text-anchor="middle">10.78.0.10</text>
  <text x="350" y="138" font-size="12" fill="#57606a" text-anchor="middle">BaseOS + AppStream repos</text>
  <text x="350" y="156" font-size="12" fill="#57606a" text-anchor="middle">NFS homes for autofs</text>
  <text x="350" y="174" font-size="12" fill="#57606a" text-anchor="middle">DNS lab.example, NTP</text>

  <!-- node1 -->
  <rect x="460" y="70" width="180" height="130" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M468,70 H632 A8,8 0 0 1 640,78 V96 H460 V78 A8,8 0 0 1 468,70 z" fill="#cc0000"/>
  <text x="550" y="88" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">node1</text>
  <text x="550" y="116" font-size="12" fill="#1f2328" text-anchor="middle">10.78.0.11</text>
  <text x="550" y="138" font-size="12" fill="#57606a" text-anchor="middle">exam node</text>
  <text x="550" y="156" font-size="12" fill="#57606a" text-anchor="middle">users, SELinux, httpd,</text>
  <text x="550" y="174" font-size="12" fill="#57606a" text-anchor="middle">autofs, scripting ...</text>

  <!-- node2 -->
  <rect x="660" y="70" width="180" height="130" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M668,70 H832 A8,8 0 0 1 840,78 V96 H660 V78 A8,8 0 0 1 668,70 z" fill="#cc0000"/>
  <text x="750" y="88" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">node2</text>
  <text x="750" y="116" font-size="12" fill="#1f2328" text-anchor="middle">10.78.0.12</text>
  <text x="750" y="138" font-size="12" fill="#57606a" text-anchor="middle">exam node</text>
  <text x="750" y="156" font-size="12" fill="#57606a" text-anchor="middle">extra disks vdb, vdc</text>
  <text x="750" y="174" font-size="12" fill="#57606a" text-anchor="middle">boot, network, LVM ...</text>

  <!-- workflow -->
  <text x="40" y="296" font-size="15" font-weight="600" fill="#1f2328">A practice run</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40" y="310" width="130" height="58" rx="29" fill="#ffffff" stroke="#d0d7de"/>
    <text x="105" y="334" font-size="14" font-weight="600" fill="#1f2328">create</text>
    <text x="105" y="352" fill="#57606a">build + snapshot</text>

    <rect x="205" y="310" width="130" height="58" rx="29" fill="#ffffff" stroke="#d0d7de"/>
    <text x="270" y="334" font-size="14" font-weight="600" fill="#1f2328">exam 1</text>
    <text x="270" y="352" fill="#57606a">reset + break</text>

    <rect x="370" y="310" width="130" height="58" rx="29" fill="#fff8f8" stroke="#cc0000"/>
    <text x="435" y="334" font-size="14" font-weight="600" fill="#cc0000">you solve</text>
    <text x="435" y="352" fill="#57606a">26 tasks, 3 h</text>

    <rect x="535" y="310" width="130" height="58" rx="29" fill="#ffffff" stroke="#d0d7de"/>
    <text x="600" y="334" font-size="14" font-weight="600" fill="#1f2328">grade</text>
    <text x="600" y="352" fill="#57606a">reboot + score</text>

    <rect x="700" y="310" width="130" height="58" rx="29" fill="#ffffff" stroke="#d0d7de"/>
    <text x="765" y="334" font-size="14" font-weight="600" fill="#1f2328">reset</text>
    <text x="765" y="352" fill="#57606a">back to clean</text>
  </g>

  <g fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M170,339 H201"/>
    <path d="M335,339 H366"/>
    <path d="M500,339 H531"/>
    <path d="M665,339 H696"/>
    <path d="M765,368 C765,412 270,412 270,372"/>
  </g>
  <text x="517" y="420" font-size="12" fill="#57606a" text-anchor="middle">next attempt</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
